
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#102f29">
<meta name="description" content="DREPA-WORLD — Une communauté mondiale. Une solidarité sans frontières.">
<title>Mon espace | DREPA-WORLD</title>

<style>
:root {
  --forest: #123c32;
  --forest-dark: #0b2923;
  --forest-light: #20594a;
  --gold: #c9a96e;
  --gold-soft: #e6d6b5;
  --cream: #f8f6f0;
  --white: #ffffff;
  --text: #25332e;
  --muted: #78827d;
  --border: #e9e9e2;
  --surface: #ffffff;
  --soft-green: #eef4ef;
  --danger: #b74d4d;
  --success: #397b59;
  --shadow: 0 12px 40px rgba(20, 49, 39, .055);
  --radius: 20px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  background: #f5f5ef;
  color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  font-size: 14px;
  overflow-x: hidden;
  transition: background 1s ease;
}

body[data-period="morning"] {
  background:
    radial-gradient(ellipse at 15% 0%, rgba(238, 215, 171, .24), transparent 38%),
    #f7f6f0;
}

body[data-period="day"] {
  background:
    radial-gradient(ellipse at 90% 0%, rgba(173, 204, 180, .16), transparent 40%),
    #f5f6f1;
}

body[data-period="evening"] {
  background:
    radial-gradient(ellipse at 10% 0%, rgba(217, 166, 111, .18), transparent 42%),
    #f4f1e9;
}

body[data-period="night"] {
  background:
    radial-gradient(ellipse at 90% 0%, rgba(70, 104, 112, .13), transparent 42%),
    #eff1ef;
}

button,
input,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
}

a {
  color: inherit;
  text-decoration: none;
}

svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* =====================================
   AMBIANCE
===================================== */

.ambient-glow {
  position: fixed;
  top: -180px;
  left: 35%;
  width: 420px;
  height: 420px;
  border-radius: 50%;
  background: rgba(201, 169, 110, .075);
  filter: blur(100px);
  pointer-events: none;
  z-index: -1;
}

/* =====================================
   HEADER
===================================== */

.topbar {
  height: 76px;
  padding: 0 4.5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  background: rgba(255, 255, 255, .88);
  border-bottom: 1px solid rgba(225, 227, 219, .8);
  backdrop-filter: blur(18px);
  position: sticky;
  top: 0;
  z-index: 100;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 235px;
}

.brand-mark {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, #1d5948, #0d3028);
  color: white;
  font-family: Georgia, serif;
  font-size: 24px;
  box-shadow: 0 5px 14px rgba(18, 60, 50, .2);
}

.brand-text {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.brand-text strong {
  color: var(--forest);
  font-size: 15px;
  letter-spacing: 1.5px;
}

.brand-text small {
  color: #929a93;
  font-size: 10px;
  letter-spacing: .25px;
}

.topbar-center {
  flex: 1;
  text-align: center;
}

.topbar-message {
  color: #8b928b;
  font-size: 12px;
  font-style: italic;
  letter-spacing: .3px;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 18px;
}

.icon-button {
  width: 40px;
  height: 40px;
  border: 1px solid var(--border);
  background: white;
  border-radius: 13px;
  color: var(--forest);
  display: grid;
  place-items: center;
  transition: .2s ease;
}

.icon-button:hover {
  background: var(--soft-green);
  transform: translateY(-2px);
}

.icon-button.is-loading svg {
  animation: rotate 1s linear infinite;
}

.account-chip {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--forest);
  font-weight: 650;
  font-size: 13px;
}

.avatar {
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: linear-gradient(145deg, #d9e8dc, #b8d0bd);
  color: #174b3c;
  font-weight: 750;
  letter-spacing: .5px;
}

.avatar-small {
  width: 34px;
  height: 34px;
  font-size: 12px;
}

.avatar-medium {
  width: 44px;
  height: 44px;
  font-size: 14px;
}

.avatar-large {
  width: 48px;
  height: 48px;
  font-size: 16px;
}

/* =====================================
   APP LAYOUT
===================================== */

.app-shell {
  width: min(1440px, 96%);
  margin: 32px auto 70px;
  display: grid;
  grid-template-columns: 230px minmax(0, 660px) 255px;
  gap: 30px;
  align-items: start;
}

.sidebar {
  min-width: 0;
}

.left-sidebar {
  position: sticky;
  top: 105px;
}

.main-content {
  min-width: 0;
}

.right-sidebar {
  position: sticky;
  top: 105px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* =====================================
   RESPONSIVE BASE
===================================== */

@media (max-width: 1150px) {
  .app-shell {
    grid-template-columns: 210px minmax(0, 1fr);
    max-width: 960px;
  }

  .right-sidebar {
    display: none;
  }
}

@media (max-width: 760px) {
  .topbar {
    height: 64px;
    padding: 0 16px;
  }

  .brand {
    min-width: 0;
  }

  .brand-mark {
    width: 37px;
    height: 37px;
    border-radius: 12px;
    font-size: 21px;
  }

  .brand-text strong {
    font-size: 13px;
  }

  .brand-text small,
  .topbar-center,
  .account-chip > span {
    display: none;
  }

  .topbar-actions {
    gap: 10px;
  }

  .app-shell {
    display: block;
    width: 100%;
    margin: 0 auto 90px;
    padding: 0 14px;
  }

  .left-sidebar {
    display: none;
  }

  .main-content {
    width: 100%;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<style>
/* =====================================
   NAVIGATION GAUCHE
===================================== */

  padding: 15px 12px 22px;
  border-bottom: 1px solid var(--border);
}

.sidebar-profile-info {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.sidebar-profile-info strong {
  color: var(--forest);
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sidebar-profile-info span {
  color: var(--muted);
  font-size: 10px;
}

.sidebar-label {
  color: #a0a79f;
  font-size: 10px;
  font-weight: 750;
  letter-spacing: 1.5px;
  margin: 25px 12px 12px;
}

.main-navigation {
  display: flex;

.nav-item {
  width: 100%;

  gap: 12px;

.nav-item svg {

.nav-item:hover:not(:disabled) {

.nav-item.active {
  color: var(--forest);

}

.nav-item.active::before {
  content: "";

  width: 3px;
  height: 25px;

}

.nav-item:disabled {
  opacity: .65;
}

.nav-item small {
  color: #a0a79f;
  font-size: 9px;
}

.sidebar-bottom {
  margin-top: 45px;
}

.sidebar-note {
  padding: 17px;
  background: linear-gradient(145deg, #eaf1e9, #f5f5ed);
  border: 1px solid #e4eae1;
  border-radius: 17px;
}

.note-symbol {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  margin-bottom: 12px;
  background: var(--forest);
  color: white;
  border-radius: 9px;
  font-family: Georgia, serif;
  font-size: 16px;
}

.sidebar-note strong {
  display: block;
  color: var(--forest);
  font-size: 12px;
  line-height: 1.5;
}

.sidebar-note p {
  margin-top: 7px;
  color: #77847a;
  font-size: 10px;
  line-height: 1.7;
}

.logout-button {
  width: 100%;
  margin-top: 17px;
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 11px;
  background: transparent;
  border: 0;
  border-radius: 12px;
  color: #8b7774;
  text-align: left;
  transition: .2s ease;
}

.logout-button:hover {
  background: #f8ecea;
  color: var(--danger);
}

.logout-button svg {
  width: 18px;
  height: 18px;
}

.logout-button span {
  font-size: 12px;
  font-weight: 600;
}

/* =====================================
   ACCUEIL
===================================== */

.welcome-section {
  min-height: 205px;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 32px 35px;
  border-radius: 23px;
  background:
    radial-gradient(circle at 85% 20%, rgba(201,169,110,.2), transparent 32%),
    linear-gradient(125deg, #153f34, #0d2d27);

  color: white;
}

.welcome-copy {
  position: relative;
  z-index: 2;

}

.eyebrow {
  display: block;
  color: #a4b5a9;
  font-size: 9px;
  font-weight: 750;
  letter-spacing: 1.8px;
}

.welcome-copy .eyebrow {
  color: #d1bc91;
}

.welcome-copy h1 {
  margin-top: 14px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(26px, 3vw, 37px);

  line-height: 1.2;
  letter-spacing: -.7px;
}

.welcome-copy h1 span {
  color: #d7bd8d;
  font-style: italic;
}

.welcome-copy p {
  max-width: 390px;
  margin-top: 12px;

.welcome-decoration {

.decoration-ring {
  position: absolute;
  border: 1px solid rgba(221, 199, 154, .32);
  border-radius: 50%;
}

.ring-one {
  width: 105px;
  height: 105px;
}

.ring-two {
  width: 145px;
  height: 145px;
  border-style: dashed;
  border-color: rgba(221, 199, 154, .22);
}

.decoration-core {
  width: 63px;
  height: 63px;
  display: grid;
  place-items: center;
  border-radius: 21px;
  background: linear-gradient(145deg, #d8bd8d, #a88a57);
  color: #183d31;
  font-family: Georgia, serif;
  font-size: 35px;
  box-shadow: 0 8px 25px rgba(0,0,0,.16);
}

/* =====================================
   INTRODUCTION COMMUNAUTAIRE
===================================== */

.community-intro {
  margin: 18px 0 30px;
  padding: 15px 18px;
  display: flex;
  align-items: flex-start;
  gap: 13px;
  background: rgba(255,255,255,.67);
  border: 1px solid rgba(229,232,224,.9);
  border-radius: 15px;
}

.intro-indicator {
  width: 8px;
  height: 8px;
  flex-shrink: 0;
  margin-top: 5px;
  border-radius: 50%;
  background: #b79a63;

}

.community-intro strong {
  display: block;
  color: var(--forest);
  font-size: 12px;
}

.community-intro p {
  margin-top: 5px;
  color: #858e86;
  font-size: 11px;
  line-height: 1.6;
}

/* =====================================
   TITRE DU FIL
===================================== */

.feed-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 17px;
}

.feed-heading .eyebrow {
  color: #9c9e8d;
}

.feed-heading h2 {
  margin-top: 8px;
  color: var(--forest);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 25px;
  font-weight: 500;
}

.feed-heading p {
  margin-top: 6px;
  color: #90978f;
  font-size: 11px;
}

.refresh-text-button {
  padding: 9px 13px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--forest);
  font-size: 11px;
  font-weight: 650;
  transition: .2s ease;
}

.refresh-text-button:hover {
  background: var(--soft-green);
}

.refresh-text-button:disabled {
  opacity: .5;
}

/* =====================================
   COMPOSITEUR
===================================== */

.composer-card {
  padding: 21px;
  margin-bottom: 26px;
  background: rgba(255,255,255,.94);
  border: 1px solid #e9ebe4;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  transition: border-color .25s ease, box-shadow .25s ease;
}

.composer-card:focus-within {
  border-color: #cbd9ca;

}

.composer-top {

}

.composer-identity {

  flex-direction: column;

}

.composer-identity strong {

}

.composer-identity span {
  color: #9aa199;
  font-size: 10px;
}

  font-size: 13px;
  line-height: 1.8;
}

#postContent::placeholder {
  color: #a6ada5;
}

.composer-divider {

}

.composer-footer {

.composer-tools {

.media-picker {

.media-picker:hover {

.media-picker svg {

.media-picker span {

}

.publish-button {

}

  border-radius: 11px;
  background: #f0f5ef;

.media-selection-info {

.media-selection-info span {

   PUBLICATIONS
===================================== */

}

.post-card {

.post-author-info span {

.post-content {

.post-media-container {

.post-media {

  max-height: 470px;

}

.media-loading,

  font-size: 10px;
}

.post-actions {

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 5px;

.post-action {

  padding: 7px 9px;

  transition: .2s ease;

.post-action:hover:not(:disabled) {
  background: #edf4ed;
  color: var(--forest);
}

}

  background: #e8f2e8;
  color: #245a43;
}

.action-symbol {
  width: 19px;
  height: 19px;
  display: grid;
  place-items: center;
  border: 1px solid currentColor;
  border-radius: 50%;
  font-size: 9px;
  font-weight: 750;
}

.post-action svg {
  width: 16px;
  height: 16px;
}

/* =====================================
   COMMENTAIRES
===================================== */

.comments-area {
  margin-top: 15px;
  padding-top: 14px;
  border-top: 1px solid #eff0eb;
}

.comments-area[hidden] {
  display: none;
}

.comments-list {
  display: flex;

  "video/mp4",
  "video/webm",
  "video/quicktime"
];

/* =========================================
   ÉLÉMENTS HTML
========================================= */

const elements = {
  refreshFeed: document.getElementById("refreshFeed"),
  refreshFeedText: document.getElementById("refreshFeedText"),

  myAvatar: document.getElementById("myAvatar"),
  myUsername: document.getElementById("myUsername"),
  sidebarAvatar: document.getElementById("sidebarAvatar"),
  sidebarUsername: document.getElementById("sidebarUsername"),

  composerAvatar: document.getElementById("composerAvatar"),
  composerUsername: document.getElementById("composerUsername"),

  postForm: document.getElementById("postForm"),
  postContent: document.getElementById("postContent"),
  mediaSelection: document.getElementById("mediaSelection"),
  selectedMediaName: document.getElementById("selectedMediaName"),
  removeMediaButton: document.getElementById("removeMediaButton"),
  mediaInput: document.getElementById("mediaInput"),
  publishButton: document.getElementById("publishButton"),
  formMessage: document.getElementById("formMessage"),

  feed: document.getElementById("feed"),
  feedSentinel: document.getElementById("feedSentinel"),
  feedStatus: document.getElementById("feedStatus"),
  loadMoreButton: document.getElementById("loadMoreButton"),

  logoutButton: document.getElementById("logoutButton")
};

/* =========================================
   ÉTAT DE L'APPLICATION
========================================= */

let currentMember = null;
let selectedMedia = null;

let nextCursor = null;
let hasMore = true;
let isLoadingFeed = false;
let isPublishing = false;

let feedObserver = null;

const mediaObjectUrls = new Map();

/* =========================================
   AMBIANCE SELON L'HEURE
========================================= */

function updateAmbientPeriod() {
  const hour = new Date().getHours();

  let period = "day";

  if (hour >= 5 && hour < 11) {
    period = "morning";
  } else if (hour >= 17 && hour < 21) {
    period = "evening";
  } else if (hour >= 21 || hour < 5) {
    period = "night";
  }

  document.body.dataset.period = period;
}

updateAmbientPeriod();

/* =========================================
   OUTILS
========================================= */

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => {
    const entities = {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    };

    return entities[character];
  });
}

function getInitials(username) {
  const name = String(username || "Membre").trim();

  if (!name) return "D";

  return name
    .split(/\s+/)
    .slice(0, 2)
    .map(part => part.charAt(0))
    .join("")
    .toUpperCase();
}

function setMemberIdentity(username) {
  const name = username || "Membre";
  const initials = getInitials(name);

  elements.myUsername.textContent = name;
  elements.sidebarUsername.textContent = name;
  elements.composerUsername.textContent = name;

  elements.myAvatar.textContent = initials;
  elements.sidebarAvatar.textContent = initials;
  elements.composerAvatar.textContent = initials;
}

function setMessage(message, type = "") {
  elements.formMessage.textContent = message;
  elements.formMessage.className = "form-message";

  if (type) {
    elements.formMessage.classList.add(type);
  }
}

function setFeedStatus(message) {
  elements.feedStatus.textContent = message;
}

function formatDate(value) {
  if (!value) return "Date inconnue";

  let date;

  if (typeof value === "string") {
    const normalized = value.includes("T")
      ? value
      : value.replace(" ", "T") + "Z";

    date = new Date(normalized);
  } else {
    date = new Date(value);
  }

  if (Number.isNaN(date.getTime())) {
    return "Date inconnue";
  }

  return new Intl.DateTimeFormat("fr-FR", {
    day: "numeric",
    month: "long",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  }).format(date);
}

function safePostId(value) {
  const id = Number(value);

  return Number.isSafeInteger(id) && id > 0
    ? id
    : null;
}

function isFormData(value) {
  return typeof FormData !== "undefined" &&
    value instanceof FormData;
}

/* =========================================
   COMMUNICATION AVEC L'API
========================================= */

async function apiRequest(path, options = {}) {
  const headers = new Headers(options.headers || {});

  if (options.body && !isFormData(options.body)) {
    headers.set("Content-Type", "application/json");
  }

  const response = await fetch(API_URL + path, {
    ...options,
    headers,
    credentials: "include"
  });

  let result = {};

  try {
    result = await response.json();
  } catch {
    result = {};
  }

  if (!response.ok || result.success === false) {
    throw new Error(
      result.message ||
      result.error ||
      "Une erreur est survenue. Réessayez."
    );
  }

  return result;
}

/* =========================================
   PROFIL DU MEMBRE
========================================= */

async function loadProfile() {
  const result = await apiRequest("/me");

  if (!result.member) {
    throw new Error("Session invalide.");
  }

  currentMember = result.member;

  setMemberIdentity(currentMember.username || "Membre");
}

/* =========================================
   GESTION DES MÉDIAS
========================================= */

function revokeMediaUrl(postId) {
  const url = mediaObjectUrls.get(postId);

  if (url) {
    URL.revokeObjectURL(url);
    mediaObjectUrls.delete(postId);
  }
}

function revokeAllMediaUrls() {
  for (const url of mediaObjectUrls.values()) {
    URL.revokeObjectURL(url);
  }

  mediaObjectUrls.clear();
}

function removeSelectedMedia() {
  selectedMedia = null;

  elements.mediaInput.value = "";
  elements.mediaSelection.hidden = true;
  elements.selectedMediaName.textContent = "";
}

function validateMedia(file) {
  if (!file) return "Aucun fichier sélectionné.";

  if (IMAGE_TYPES.includes(file.type)) {
    if (file.size > MAX_IMAGE_SIZE) {
      return "Cette image dépasse la limite de 8 Mo.";
    }

    return "";
  }

  if (VIDEO_TYPES.includes(file.type)) {
    if (file.size > MAX_VIDEO_SIZE) {
      return "Cette vidéo dépasse la limite de 50 Mo.";
    }

    return "";
  }

  return "Format non accepté. Choisissez une image ou une vidéo.";
}

elements.mediaInput.addEventListener("change", () => {
  const file = elements.mediaInput.files[0];

  if (!file) {
    removeSelectedMedia();
    return;
  }

  const error = validateMedia(file);

  if (error) {
    removeSelectedMedia();
    setMessage(error, "error");
    return;
  }

  selectedMedia = file;

  elements.selectedMediaName.textContent = file.name;
  elements.mediaSelection.hidden = false;

  setMessage("");
});

elements.removeMediaButton.addEventListener("click", () => {
  removeSelectedMedia();
  setMessage("");
});

/* =========================================
   AFFICHAGE DES PUBLICATIONS
========================================= */

function renderPost(post) {
  const postId = safePostId(post.id);

  if (!postId) return "";

  const author = escapeHTML(
    post.author || post.username || "Membre"
  );

  const initials = escapeHTML(
    getInitials(post.author || post.username || "Membre")
  );

  const content = escapeHTML(post.content || "");

  const date = escapeHTML(
    formatDate(post.created_at)
  );

  const reactionsCount = Number(post.reactions_count) || 0;
  const commentsCount = Number(post.comments_count) || 0;

  const contentHTML = content
    ? `<div class="post-content">${content.replace(/\n/g, "<br>")}</div>`
    : "";

  const mediaHTML = post.media_url
    ? `
      <div class="post-media-container" data-media-post="${postId}">
        <div class="media-loading">
          <span class="loading-spinner"></span>
          <span>Chargement du média...</span>
        </div>
      </div>
    `
    : "";

  return `
    <article class="post-card" data-post-id="${postId}">

      <div class="post-header">
        <div class="avatar avatar-medium post-avatar">
          ${initials}
        </div>

        <div class="post-author-info">
          <strong>${author}</strong>
          <span>${date}</span>
        </div>

        <span class="post-brand-mark">D</span>
      </div>

      ${contentHTML}
      ${mediaHTML}

      <div class="post-stats">
        <span class="reaction-total" data-reaction-total="${postId}">
          ${reactionsCount} réaction${reactionsCount > 1 ? "s" : ""}
        </span>

        <span>
          ${commentsCount} commentaire${commentsCount > 1 ? "s" : ""}
        </span>
      </div>

      <div class="post-actions">

        <button class="post-action reaction-button"
          type="button"
          data-reaction="like"
          data-post-id="${postId}">
          <span class="action-symbol">+</span>
          <span>J'aime</span>
        </button>

        <button class="post-action reaction-button"
          type="button"
          data-reaction="support"
          data-post-id="${postId}">
          <span class="action-symbol">S</span>
          <span>Soutenir</span>
        </button>

        <button class="post-action reaction-button"
          type="button"
          data-reaction="courage"
          data-post-id="${postId}">
          <span class="action-symbol">C</span>
          <span>Courage</span>
        </button>

        <button class="post-action comment-toggle"
          type="button"
          data-post-id="${postId}">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/>
          </svg>
          <span>Commenter</span>
        </button>

      </div>

      <section class="comments-area"
        data-comments-area="${postId}"
        hidden>

        <div class="comments-list" data-comments-list="${postId}">
          <p class="comments-loading">Chargement des commentaires...</p>
        </div>

        <form class="comment-form" data-comment-form="${postId}">
          <input
            type="text"
            name="content"
            maxlength="2000"
            placeholder="Écrire un commentaire..."
            aria-label="Écrire un commentaire"
            required
          />

          <button type="submit">Envoyer</button>
        </form>

        <p class="comment-message"
          data-comment-message="${postId}"
          role="status"></p>

      </section>

    </article>
  `;
}

/* =========================================
   CHARGEMENT DES MÉDIAS
========================================= */

async function attachPostMedia(post) {
  if (!post.media_url) return;

  const postId = safePostId(post.id);

  if (!postId) return;

  const container = elements.feed.querySelector(
    `[data-media-post="${postId}"]`
  );

  if (!container) return;

  try {
    const response = await fetch(API_URL + post.media_url, {
      credentials: "include"
    });

    if (!response.ok) {
      throw new Error("Média indisponible.");
    }

    const blob = await response.blob();
    const objectUrl = URL.createObjectURL(blob);

    const currentContainer = elements.feed.querySelector(
      `[data-media-post="${postId}"]`
    );

    if (!currentContainer) {
      URL.revokeObjectURL(objectUrl);
      return;
    }

    revokeMediaUrl(postId);
    mediaObjectUrls.set(postId, objectUrl);

    let mediaElement;

    if (blob.type.startsWith("video/")) {
      mediaElement = document.createElement("video");
      mediaElement.controls = true;
      mediaElement.preload = "metadata";
      mediaElement.playsInline = true;
    } else {
      mediaElement = document.createElement("img");
      mediaElement.alt = "Média partagé par un membre";
      mediaElement.loading = "lazy";
    }

    mediaElement.className = "post-media";
    mediaElement.src = objectUrl;

    currentContainer.replaceChildren(mediaElement);

  } catch (error) {
    const currentContainer = elements.feed.querySelector(
      `[data-media-post="${postId}"]`
    );

    if (currentContainer) {
      currentContainer.innerHTML = `
        <div class="media-error">
          Ce média n'a pas pu être chargé.
        </div>
      `;
    }
  }
}

/* =========================================
   CHARGEMENT DU FIL
========================================= */

async function loadPosts(reset = false) {
  if (isLoadingFeed) return;

  if (!reset && !hasMore) return;

  isLoadingFeed = true;

  if (reset) {
    revokeAllMediaUrls();

    elements.feed.innerHTML = `
      <div class="feed-loading">
        <span class="loading-spinner"></span>
        <p>Chargement des publications...</p>
      </div>
    `;

    nextCursor = null;
    hasMore = true;
  }

  elements.loadMoreButton.hidden = true;
  setFeedStatus("Chargement des publications...");

  try {
    let path = `/posts?limit=${PAGE_SIZE}`;

    if (!reset && nextCursor) {
      path += `&cursor=${encodeURIComponent(nextCursor)}`;
    }

    const result = await apiRequest(path);

    const posts = Array.isArray(result.posts)
      ? result.posts
      : [];

    if (reset) {
      elements.feed.innerHTML = "";
    }

    if (posts.length === 0 && reset) {
      elements.feed.innerHTML = `
        <div class="empty-feed">
          <div class="empty-feed-mark">D</div>
          <h3>Le début d'une belle histoire.</h3>
          <p>
            Il n'y a pas encore de publication.
            Soyez parmi les premiers à partager quelque chose avec la communauté.
          </p>
        </div>
      `;
    } else {
      for (const post of posts) {
        const html = renderPost(post);

        if (!html) continue;

        elements.feed.insertAdjacentHTML("beforeend", html);
        attachPostMedia(post);
      }
    }

    hasMore = Boolean(result.hasMore);
    nextCursor = result.nextCursor || null;

    if (hasMore) {
      setFeedStatus("Faites défiler pour découvrir la suite.");
      elements.loadMoreButton.hidden = false;
    } else {
      setFeedStatus(
        posts.length > 0
          ? "Vous êtes à jour."
          : "Aucune autre publication pour le moment."
      );
    }

  } catch (error) {
    if (reset) {
      elements.feed.innerHTML = `
        <div class="feed-error">
          <h3>Impossible de charger le fil.</h3>
          <p>${escapeHTML(error.message)}</p>
          <button type="button" class="retry-feed-button">
            Réessayer
          </button>
        </div>
      `;
    }

    setFeedStatus("Une erreur est survenue.");
    elements.loadMoreButton.hidden = false;

  } finally {
    isLoadingFeed = false;
  }
}

/* =========================================
   ACTUALISATION
========================================= */

async function refreshFeed() {
  if (isLoadingFeed) return;

  elements.refreshFeed.classList.add("is-loading");

  if (elements.refreshFeedText) {
    elements.refreshFeedText.disabled = true;
  }

  await loadPosts(true);

  elements.refreshFeed.classList.remove("is-loading");

  if (elements.refreshFeedText) {
    elements.refreshFeedText.disabled = false;
  }
}

elements.refreshFeed.addEventListener("click", refreshFeed);

if (elements.refreshFeedText) {
  elements.refreshFeedText.addEventListener("click", refreshFeed);
}

/* =========================================
   CHARGEMENT PROGRESSIF
========================================= */

function setupFeedObserver() {
  if (!("IntersectionObserver" in window)) return;

  feedObserver = new IntersectionObserver(entries => {
    for (const entry of entries) {
      if (entry.isIntersecting && hasMore && !isLoadingFeed) {
        loadPosts(false);
      }
    }
  }, {
    root: null,
    rootMargin: "600px",
    threshold: 0
  });

  feedObserver.observe(elements.feedSentinel);
}

elements.loadMoreButton.addEventListener("click", () => {
  loadPosts(false);
});

/* =========================================
   PUBLICATION
========================================= */

elements.postForm.addEventListener("submit", async event => {
  event.preventDefault();

  if (isPublishing) return;

  const content = elements.postContent.value.trim();

  if (!content && !selectedMedia) {
    setMessage(
      "Écrivez un message ou ajoutez une photo ou une vidéo.",
      "error"
    );
    return;
  }

  if (selectedMedia) {
    const mediaError = validateMedia(selectedMedia);

    if (mediaError) {
      setMessage(mediaError, "error");
      return;
    }
  }

  isPublishing = true;
  elements.publishButton.disabled = true;
  elements.publishButton.classList.add("is-loading");

  elements.publishButton.querySelector("span").textContent =
    "Publication...";

  setMessage("Votre publication est en cours d'envoi.");

  try {
    if (selectedMedia) {
      const formData = new FormData();

      formData.append("content", content);
      formData.append("media", selectedMedia);

      await apiRequest("/posts", {
        method: "POST",
        body: formData
      });

    } else {
      await apiRequest("/posts", {
        method: "POST",
        body: JSON.stringify({ content })
      });
    }

    elements.postContent.value = "";
    removeSelectedMedia();

    setMessage(
      "Votre publication a bien été partagée.",
      "success"
    );

    await loadPosts(true);

  } catch (error) {
    setMessage(error.message, "error");

  } finally {
    isPublishing = false;
    elements.publishButton.disabled = false;
    elements.publishButton.classList.remove("is-loading");

    elements.publishButton.querySelector("span").textContent =
      "Publier";
  }
});

/* =========================================
   RÉACTIONS
========================================= */

async function sendReaction(button) {
  const postId = safePostId(button.dataset.postId);
  const reaction = button.dataset.reaction;

  if (
    !postId ||
    !["like", "support", "courage"].includes(reaction)
  ) {
    return;
  }

  if (button.disabled) return;

  button.disabled = true;
  button.classList.add("is-loading");

  try {
    const result = await apiRequest(
      `/posts/${postId}/reactions`,
      {
        method: "POST",
        body: JSON.stringify({ reaction })
      }
    );

    button.classList.add("reaction-sent");

    if (result.reactions_count !== undefined) {
      const total = elements.feed.querySelector(
        `[data-reaction-total="${postId}"]`
      );

      if (total) {
        const count = Number(result.reactions_count) || 0;

        total.textContent =
          `${count} réaction${count > 1 ? "s" : ""}`;
      }
    }

    if (
      !window.matchMedia("(prefers-reduced-motion: reduce)").matches &&
      "vibrate" in navigator
    ) {
      navigator.vibrate(10);
    }

    const originalText = button.innerHTML;

    button.querySelector("span:last-child").textContent = "Envoyé";

    setTimeout(() => {
      if (!button.isConnected) return;

      button.classList.remove("reaction-sent");
      button.innerHTML = originalText;
      button.disabled = false;
    }, 1400);

  } catch (error) {
    button.classList.remove("is-loading");
    button.disabled = false;
    button.title = error.message;

  } finally {
    button.classList.remove("is-loading");
  }
}

/* =========================================
   COMMENTAIRES
========================================= */

function renderComment(comment) {
  const author = escapeHTML(
    comment.author || 
    comment.username || "Membre"
  );

  const initials = escapeHTML(
    getInitials(comment.author || comment.username || "Membre")
  );

  const content = escapeHTML(comment.content || "");

  const date = escapeHTML(formatDate(comment.created_at));

  return `
    <div class="comment-item">
      <div class="avatar avatar-comment">${initials}</div>

      <div class="comment-content">
        <div class="comment-bubble">
          <strong>${author}</strong>
          <p>${content.replace(/\n/g, "<br>")}</p>
        </div>

        <span class="comment-date">${date}</span>
      </div>
    </div>
  `;
}

async function loadComments(postId) {
  const list = elements.feed.querySelector(
    `[data-comments-list="${postId}"]`
  );

  if (!list) return;

  list.innerHTML = `
    <p class="comments-loading">Chargement des commentaires...</p>
  `;

  try {
    const result = await apiRequest(`/posts/${postId}/comments`);

    const comments = Array.isArray(result.comments)
      ? result.comments
      : [];

    if (comments.length === 0) {
      list.innerHTML = `
        <p class="no-comments">
          Aucun commentaire pour le moment. Lancez la conversation.
        </p>
      `;
      return;
    }

    list.innerHTML = comments.map(renderComment).join("");

  } catch (error) {
    list.innerHTML = `
      <p class="comments-error">
        Impossible de charger les commentaires.
      </p>
    `;
  }
}

async function submitComment(form) {
  const postId = safePostId(form.dataset.commentForm);

  if (!postId) return;

  const input = form.querySelector('input[name="content"]');
  const button = form.querySelector('button[type="submit"]');

  const message = elements.feed.querySelector(
    `[data-comment-message="${postId}"]`
  );

  const content = input.value.trim();

  if (!content) return;

  button.disabled = true;
  button.textContent = "Envoi...";

  try {
    await apiRequest(`/posts/${postId}/comments`, {
      method: "POST",
      body: JSON.stringify({ content })
    });

    input.value = "";

    message.textContent = "Commentaire envoyé.";
    message.className = "comment-message success";

    await loadComments(postId);

    const card = elements.feed.querySelector(
      `[data-post-id="${postId}"]`
    );

    if (card) {
      const stats = card.querySelector(".post-stats span:last-child");

      if (stats) {
        const current = Number(
          stats.textContent.match(/\d+/)?.[0] || 0
        );

        const updated = current + 1;

        stats.textContent =
          `${updated} commentaire${updated > 1 ? "s" : ""}`;
      }
    }

  } catch (error) {
    message.textContent = error.message;
    message.className = "comment-message error";

  } finally {
    button.disabled = false;
    button.textContent = "Envoyer";
  }
}

/* =========================================
   ÉVÉNEMENTS DU FIL
========================================= */

elements.feed.addEventListener("click", event => {
  const retryButton = event.target.closest(".retry-feed-button");

  if (retryButton) {
    loadPosts(true);
    return;
  }

  const reactionButton = event.target.closest(".reaction-button");

  if (reactionButton) {
    sendReaction(reactionButton);
    return;
  }

  const commentButton = event.target.closest(".comment-toggle");

  if (commentButton) {
    const postId = safePostId(commentButton.dataset.postId);

    if (!postId) return;

    const area = elements.feed.querySelector(
      `[data-comments-area="${postId}"]`
    );

    if (!area) return;

    const opening = area.hidden;
    area.hidden = !opening;

    if (opening) {
      loadComments(postId);
    }
  }
});

elements.feed.addEventListener("submit", event => {
  const form = event.target.closest(".comment-form");

  if (!form) return;

  event.preventDefault();
  submitComment(form);
});

/* =========================================
   NAVIGATION
========================================= */

document.querySelectorAll("[data-nav]").forEach(button => {
  button.addEventListener("click", () => {
    if (button.disabled) return;

    if (button.dataset.nav !== "feed") return;

    document.querySelectorAll("[data-nav]").forEach(item => {
      item.classList.toggle(
        "active",
        item.dataset.nav === "feed"
      );
    });

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  });
});

/* =========================================
   DÉCONNEXION
========================================= */

elements.logoutButton.addEventListener("click", async () => {
  elements.logoutButton.disabled = true;

  try {
    await apiRequest("/logout", {
      method: "POST",
      body: JSON.stringify({})
    });
  } catch (error) {
    // Retour à l'écran de connexion même si la requête échoue.
  }

  revokeAllMediaUrls();

  window.location.href = "connexion.html";
});

/* =========================================
   INITIALISATION
========================================= */

async function initializePage() {
  try {
    await loadProfile();

    setupFeedObserver();

    await loadPosts(true);

  } catch (error) {
    revokeAllMediaUrls();

    window.location.href = "connexion.html";
  }
}

initializePage();

/* =========================================
   NETTOYAGE
========================================= */

window.addEventListener("pagehide", () => {
  if (feedObserver) {
    feedObserver.disconnect();
  }

  revokeAllMediaUrls();
});
</script>
